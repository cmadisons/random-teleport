# Done to increase the memory available to gradle.
org.gradle.jvmargs=-Xmx1G
org.gradle.parallel=true

# --- Local machine setting (NOT for sharing / committing) ---------------------
# Minecraft 26.1.2 modding + Gradle 9.5 require JDK 25 to run the build, but this
# machine's default `java` on PATH is still Java 11. This line points Gradle at the
# Temurin 25 JDK installed under ~/Library/Java/JavaVirtualMachines so `./gradlew`
# "just works". If you move this project to another machine, update or remove this
# line (or set JAVA_HOME to a JDK 25). See the workspace README for details.
org.gradle.java.home=/Users/nicholas/Library/Java/JavaVirtualMachines/temurin-25.jdk/Contents/Home
# ------------------------------------------------------------------------------

# IntelliJ IDEA is not yet fully compatible with configuration cache, see: https://github.com/FabricMC/fabric-loom/issues/1349
org.gradle.configuration-cache=false

# Fabric Properties
# check these on https://fabricmc.net/develop
minecraft_version=26.1.2
loader_version=0.19.3
loom_version=1.17-SNAPSHOT

# Mod Properties
mod_version=1.0.0
maven_group=com.example

# Dependencies
fabric_api_version=0.155.2+26.1.2
modmenu_version=18.0.0
